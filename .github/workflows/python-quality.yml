name: Python quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        # Read the test dependency list out of pyproject.toml's [test] extra
        # instead of keeping a second hand-written list here. The two drifted
        # twice -- rdflib was missing when the RDF tests were added, and pandas
        # when the storage tests landed (a dependency declared in pyproject.toml
        # but never installed) -- and each time it surfaced as a collection error
        # that blocked every open PR. One source of truth for dependencies.
        run: |
          python -m pip install --upgrade pip ruff
          python -c "import tomllib,pathlib;print(chr(10).join(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['optional-dependencies']['test']))" > /tmp/test-requirements.txt
          cat /tmp/test-requirements.txt
          python -m pip install -r /tmp/test-requirements.txt
      - name: Check syntax
        run: python -m compileall -q roihu_*.py
      - name: Ruff (human-code compatibility debt; report only)
        continue-on-error: true
        run: ruff check roihu_*.py

      - name: Contract tests (Roihu baseline + legacy pipeline contract)
        run: python -m pytest -q tests/
