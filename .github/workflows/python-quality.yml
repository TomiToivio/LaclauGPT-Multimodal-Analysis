name: Python quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        run: python -m pip install --upgrade pip ruff
      - name: Check syntax
        run: python -m compileall -q puhti_*.py
      - name: Ruff
        run: ruff check puhti_*.py
