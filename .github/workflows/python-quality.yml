name: Python quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        run: python -m pip install --upgrade pip ruff pytest
      - name: Check syntax
        run: python -m compileall -q roihu_*.py
      - name: Ruff (human-code compatibility debt; report only)
        continue-on-error: true
        run: ruff check roihu_*.py

      - name: Contract tests (Roihu baseline + legacy pipeline contract)
        run: pytest -q tests/
