name: CSV RDF projection

on:
  push:
    branches: [main]
  pull_request:

jobs:
  csv-rdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation tooling
        run: python -m pip install 'ruff>=0.11,<1' 'rdflib>=7,<8'
      - name: Check standalone export
        run: |
          python -m ruff check roihu_csv_rdf.py tests/test_roihu_csv_rdf.py
          python -m unittest discover -s tests -p test_roihu_csv_rdf.py -v
          bash -n scripts/roihu/csv_rdf_roihu.sbatch
